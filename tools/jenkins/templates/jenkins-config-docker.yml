# ===================================================================
# jenkins-config-docker.yml — 前端 SPA + Docker 镜像推送 配置示例
# 用法: bash scripts/generate-jenkinsfile.sh -y ./jenkins-config-docker.yml
# 优先级: 命令行参数 > 本文件 > .env > 内置默认
# 前置条件: 项目根目录存在 Dockerfile
# ===================================================================

# 项目类型: frontend | frontend-yarn | frontend-docker | java | python
type: frontend-docker

# 输出文件路径（默认 ./Jenkinsfile）
output: ./Jenkinsfile

# 构建环境: dev | test | prod（prod 额外推送 :latest 标签）
env: prod

# --- 前端 (npm) ---
node_version: "22"                                   # Node 版本 (nvm 安装/切换)
git_credential_id: cland-wd-dao-game                 # Git 仓库凭据 ID
npm_registry: https://registry.npmmirror.com         # npm 镜像源
node_options: "--max-old-space-size=4096"            # NODE_OPTIONS

# --- Docker 镜像 ---
image_name: my-spa                                   # 镜像名（不含仓库前缀）
docker_registry: registry.example.com                # 镜像仓库地址
docker_credentials_id: docker-hub                    # 仓库登录凭证 ID (username/password)
